services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      GITHUB_OWNER: ${GITHUB_OWNER:-Murray-Assal}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORIES: ${GITHUB_REPOSITORIES:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rag:rag@postgres:5432/rag
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      GITHUB_OWNER: ${GITHUB_OWNER:-Murray-Assal}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORIES: ${GITHUB_REPOSITORIES:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      bash -c "airflow db migrate && (airflow users create
      --username admin --password admin --firstname Admin --lastname User
      --role Admin --email admin@example.com || true)"

  airflow-webserver:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment: *airflow-env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver

  airflow-scheduler:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment: *airflow-env
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  postgres_data:
